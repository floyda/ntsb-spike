      description: 'Get cases by start/end date, optionally filtered by mode. Results are marker-paginated, up to 1000 records per page. Large date ranges can produce very large payloads; use smaller windows or mode filtering in interactive docs.'
      operationId: get-cases-by-date-range-v2
      parameters:
        - name: startDate
          in: query
          description: Format - date.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Format - date.
          schema:
            type: string
            format: date
        - name: mode
          in: query
          description: 'Optional mode filter. Allowed values aviation, hazmat, highway, marine, pipeline, railroad.'
