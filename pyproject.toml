[project]
name = "ntsb-spike"
version = "0.0.1"
description = "Pre-build validation for an NTSB probable-cause agent"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "pydantic>=2.0",
]

[project.optional-dependencies]
model = ["anthropic>=0.30"]
mdb = ["pandas-access>=0.0.1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ntsb_spike"]
